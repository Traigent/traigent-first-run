name: Validate

on:
  pull_request:
  push:

# The only place this workflow names a container image. Both jobs run this one:
# `offline-contract` runs the hermetic harness inside it, and `validate` hands
# it to the container-backed half of `tests/test_verify_sandbox.py`. The digest
# was already written twice for the job below, and a third copy is how one
# pinned image quietly becomes two that differ, in a file that still reads as
# if it pinned one.
env:
  PINNED_PYTHON_IMAGE: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    # Measured, and re-derivable. Source: every successful `offline-contract`
    # job on `first-run-guide` from 2026-07-20 to 2026-08-06, n=65, read with
    # `gh run list --branch first-run-guide --workflow validate.yml` and
    # `gh run view <id> --json jobs`. Durations: 13s min / 19s p50 / 31s p95 /
    # 32s max.
    #
    # The median is the wrong number to bound against here, because the series
    # trends upward as the package grows: the ten most recent runs are 27-32s
    # against a whole-window p50 of 19s.
    #
    # But the measurement is not what sets this number, and this job is the
    # reason. `harness.py --all` calls `calibrate_evaluator.py` with no
    # `--timeout`, so that command runs on the DERIVED bound - the calibrator's
    # own ceiling plus headroom, 660s today. A five-minute job cap is 360s below
    # that, so a hung calibration was killed by GitHub with a bare cancellation
    # and the harness never wrote the partial stdout and stderr that says why.
    # The floor is therefore derived from the same constant, not chosen against
    # the measurement, and
    # `tests/test_skill_package.py::test_every_ci_job_outlives_the_harness_bound`
    # fails if this number drops below it. It is 19 minutes today: 16 for the
    # command, 3 for everything else in the job - a little over twice the
    # slowest whole job of either kind ever recorded, 104s.
    #
    # 14 until #151, which let a slow evaluator finish and so raised the
    # calibrator's ceiling to 900s - moving the floor this number is derived
    # from to 19. #162 wrote the derivation and #151 moved its input; neither
    # branch could see the other, the merge is textually clean, and the guard
    # firing on the composition is the whole reason it exists.
    timeout-minutes: 19
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Acquire pinned Python runner outside the evidence boundary
        run: docker pull "$PINNED_PYTHON_IMAGE"

      - name: Run hermetic pre-network contract scenarios
        run: |
          mkdir -p "$RUNNER_TEMP/traigent-offline-evidence"
          chmod 0777 "$RUNNER_TEMP/traigent-offline-evidence"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --user 65534:65534 \
            -e TRAIGENT_OFFLINE_ISOLATED=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/traigent-offline-evidence:/evidence" \
            --tmpfs /work:rw,exec,nosuid,nodev,uid=65534,gid=65534,mode=0700 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,uid=65534,gid=65534,mode=0700 \
            -w /repo \
            "$PINNED_PYTHON_IMAGE" \
            python tests/behavioral/harness.py --all --evidence-dir /evidence

      - name: Upload offline contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: offline-contract-evidence
          path: ${{ runner.temp }}/traigent-offline-evidence
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: offline-contract
    runs-on: ubuntu-latest
    # Same source and window, n=68 (this job predates `offline-contract`, hence
    # the three extra runs): 12s min / 22.5s p50 / 97s p95 / 104s max, with the
    # same upward trend - the ten most recent are 59-104s. Added to the observed
    # maximum, not to the median: the slow-evaluator end-to-end test this branch
    # introduces sleeps 33s inside a local scorer - 33s by construction, and
    # 34.2s wall for the test measured on a developer machine, not on a runner.
    # Source: tests/behavioral/test_contracts.py#ExplicitTimeoutEndToEndTests -
    # so the projected worst case for the job's own work is about 140s.
    #
    # This job runs `tests/behavioral/test_contracts.py`, which drives the same
    # `run_command`, so the same floor applies for the same reason: at ten
    # minutes the job was killed 60s before the harness's own 660s bound could
    # fire, and the preserved-output diagnostic was exactly what was lost. Both
    # jobs now carry one derived floor rather than two hand-picked multiples of
    # two different measurements - the earlier 5x/10x split was justified by the
    # jobs' own runtimes, which is not the quantity that decides who kills the
    # command first.
    #
    # The three-minute margin still covers what was reasoned about before: this
    # job makes three `pip install` calls against live PyPI, the only step in
    # either job whose duration depends on a third party, and a slow index must
    # not be reported as a broken pull request.
    #
    # Also raised from 14 to 19 by #151's calibrator ceiling; see the note on
    # the job above.
    timeout-minutes: 19
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Fail fast on a lock that was never regenerated
        # The scenario fixture locks are the only generated locks left.
        # `test_contracts.py` already fails on a stale one, but only after the
        # installs, and only on parsed JSON. This runs first and compares the
        # rendered text, so a reflowed or hand-edited lock is caught too.
        run: python tools/relock.py --check

      - name: Install validation tools
        run: python -m pip install ruff==0.15.12 black==26.5.1

      - name: Install pinned first-run dependencies outside the evidence boundary
        run: python -m pip install -r skills/traigent-first-run/assets/requirements-first-run.txt

      - name: Put the pinned image where the boundary cases look for one
        # `tests/test_verify_sandbox.py` drives a real container for the half of
        # the boundary verifier that only an operating system can answer, and it
        # refuses to fetch an image itself, because a test suite must not reach
        # the network. It uses one ALREADY on the host, found by tag. This job
        # never put one there, so those five cases have reported `skipped` on
        # every run of this workflow. The skip is loud and it is right on a
        # developer machine with no runtime; here a runtime is present and the
        # skip is a hole, and two defects that only a real boundary can see -
        # a verdict that turns on which base image is under it, and a case that
        # only holds on one vendor's daemon - went green through it.
        #
        # The tag is cut from the pinned reference rather than typed a second
        # time, so the name the suite looks for cannot come to mean an image
        # other than the one pinned above.
        run: |
          docker pull "$PINNED_PYTHON_IMAGE"
          docker tag "$PINNED_PYTHON_IMAGE" "${PINNED_PYTHON_IMAGE%@*}"

      - name: Run the container-backed cases here, and refuse a skip
        # A pull that fails takes the step above down with it: a `run:` block is
        # `bash -e`, both commands are their own line, and neither is piped or
        # excused. The failure this step is here for is the quiet one - the pull
        # succeeds, what landed is not what the suite looks for, `unittest` exits
        # 0 over the skips, and the tick says the boundary was proven.
        #
        # An earlier form of this step asked `usable_container_image` for its
        # answer and stopped there. That establishes an image was usable in THIS
        # process, and the cases are selected by the same call re-run minutes
        # later in another one - a distinction that is not academic, because
        # that selector has answered with an image in one process and `None` in
        # the next against a daemon that could no longer start a container. So
        # `RealBoundaryTests` is loaded and RUN here rather than cleared for
        # takeoff, and the result is read instead of the precondition: a skip
        # fails this step, an unsuccessful run fails it, and a run that does not
        # reach every case the loader found fails it. A skip has to be refused
        # rather than reported, and refused whatever its cause - `unittest` exits
        # 0 over each of them alike, the mount-shaped cases carry a `skipTest` of
        # their own for a daemon that refuses a bind mount, and the next one
        # added will be for a reason this step cannot be written to anticipate.
        #
        # The digest comparison stays, and goes first: "an image is present" and
        # "the pinned image is present" are two claims, and which base is
        # underneath is exactly what two of these verdicts turn on - one of
        # them reads the variables the image itself defines. Asking the selector
        # for the answer rather than re-stating it means whatever
        # `usable_container_image` comes to prefer is what gets compared. It
        # prefers `python:3.12-slim`, which is the tag the step above cuts from
        # the pinned reference, so the two agree here by construction. If they
        # ever stop agreeing, these cases are running on an image this file does
        # not pin, and the step above is where that tag is decided.
        #
        # How many cases there are is asked of the loader, not typed here, so a
        # new case runs under the commit that writes it rather than under the
        # one that later notices. A floor IS typed, because a count taken from
        # the loader agrees with itself no matter how few cases remain, and this
        # step passing over an emptied class is the same green tick arrived at
        # from the other side. The floor was typed one below the class it was
        # written against, which made it decoration: the case that pins this
        # branch's headline fix could be deleted and this step would still pass.
        # So the floor is held EQUAL to the cases that exist, by
        # `tests/test_skill_package.py`, which derives the number from the class
        # rather than reading it back from here - raising it belongs to the
        # commit that adds a case, and lowering it to the commit that removes
        # one.
        #
        # `expectedFailures` and `unexpectedSuccesses` are read for the same
        # reason the skips are. Measured on 3.12.3: an `@unittest.expectedFailure`
        # on a case yields `skipped=[]`, `failures=[]`, `errors=[]`,
        # `wasSuccessful()` True and `testsRun == loaded`, so the decorator
        # turns a refuted boundary into a green tick and every other check here
        # agrees with it. A boundary case that is known not to hold is the
        # failure this step reports, never a state it tolerates.
        #
        # And every one of those refusals holds for a case whose body is `pass`.
        # Bodies rewritten to `self.assertIn(str(IMAGE), self.boundary())` NAME
        # the image, satisfy the loader, skip nothing, fail nothing and clear
        # the floor, having entered no boundary at all. Measured on this branch:
        # `Ran 8 tests in 0.000s`, `OK`, and this step exited 0 with the runtime
        # never asked for a container. Source: this block run as `bash -e`
        # through a copy of `tests/test_verify_sandbox.py` carrying that body -
        # the world `a case starts no container` in
        # `test_the_boundary_gate_refuses_every_answer_short_of_a_proven_boundary`.
        #
        # No rule read off the cases' source separates naming a runtime from
        # entering one, so the last question is not asked of them. What the
        # daemon started while each case ran is read off the engine's own event
        # stream as that case ends, and a case with no `start` of the pinned
        # image inside its own window fails this step. Counting containers on
        # the host instead cannot answer it - every boundary command carries
        # `--rm`, so one that started and exited leaves nothing to count - and a
        # marker the cases write would be a convention the next case author has
        # to know about, satisfiable by the same forgery that prompted it. The
        # daemon's ledger needs no cooperation from a case, and no case writes
        # it. What it proves is that a container of the pinned image ran while
        # the case ran, which is not the same as the case's verdict depending on
        # it: a case that starts one and then asserts nothing still passes here.
        #
        # None of this reaches a developer without a runtime: the skip stays
        # available and stays loud where it is the honest answer. It is refused
        # HERE, on a runner where a runtime is guaranteed present and a skip can
        # therefore only mean the setup broke.
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import unittest

          FLOOR = 8

          sys.path.insert(0, "tests")
          import test_verify_sandbox as boundary

          if boundary.IMAGE is None:
              raise SystemExit(
                  "a container runtime IS available on this runner, so this is a "
                  "setup failure and not a skip. " + boundary.NO_RUNTIME
              )

          digest = os.environ["PINNED_PYTHON_IMAGE"].split("@", 1)[1]
          inspected = subprocess.run(
              ["docker", "image", "inspect", boundary.IMAGE],
              capture_output=True, text=True, check=True,
          )
          published = json.loads(inspected.stdout)[0]["RepoDigests"]
          if not any(reference.endswith("@" + digest) for reference in published):
              raise SystemExit(
                  f"the boundary cases would run on {boundary.IMAGE}, published as "
                  f"{published}, which is not the image this workflow pins ({digest})"
              )
          print(f"boundary cases will run on {boundary.IMAGE}, pinned as {digest}")

          cases = getattr(boundary, "RealBoundaryTests", None)
          if cases is None:
              raise SystemExit(
                  "tests/test_verify_sandbox.py no longer defines RealBoundaryTests, "
                  "which is the class this step exists to run. Name whatever "
                  "replaced it here, in the commit that renames it."
              )
          if (cases.__module__, cases.__qualname__) != (
              boundary.__name__,
              "RealBoundaryTests",
          ):
              raise SystemExit(
                  f"RealBoundaryTests names {cases.__module__}.{cases.__qualname__} "
                  "rather than the container-backed class defined in "
                  "tests/test_verify_sandbox.py, so this step would run whatever it "
                  "was pointed at and report the boundary as proven"
              )
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(cases)
          loaded = suite.countTestCases()
          if loaded < FLOOR:
              raise SystemExit(
                  f"RealBoundaryTests offers {loaded} cases, below the floor of "
                  f"{FLOOR} this step holds it to, so cases have been removed. If "
                  "that was deliberate, lower FLOOR in the commit that removes them."
              )

          class Ledgered(unittest.TextTestResult):
              """Each case, and what the daemon started while that case ran.

              The window is the case, so nothing has to be attributed to one
              afterwards - the reading is taken as the case ends, over the
              case's own span. Taken once at the end instead, it would also
              have to survive the engine's replay buffer, which is bounded:
              measured here on 29.6.1 through 60 `docker run --rm` of the
              pinned image inside one window, 300 container events were
              produced and the replay of that window returned 183 of them, so
              23 of those 60 `start` events had already aged out. Per case the
              window is a handful of events deep and cannot age out from under
              a longer class. An eviction would fail this step rather than
              pass it either way, which is the right direction and still not a
              reading worth taking.
              """

              def __init__(self, *arguments, **keywords):
                  self.entered = {}
                  self.opened = None
                  super().__init__(*arguments, **keywords)

              def startTest(self, case):
                  self.opened = time.time()
                  super().startTest(case)

              def stopTest(self, case):
                  super().stopTest(case)
                  recorded = subprocess.run(
                      [
                          "docker",
                          "system",
                          "events",
                          "--since",
                          f"{self.opened:.9f}",
                          "--until",
                          f"{time.time():.9f}",
                          "--filter",
                          "type=container",
                          "--filter",
                          "event=start",
                          "--format",
                          "{{json .}}",
                      ],
                      capture_output=True, text=True, check=True,
                  )
                  self.entered[case.id()] = [
                      (json.loads(line).get("Actor") or {})
                      .get("Attributes", {})
                      .get("image")
                      for line in recorded.stdout.splitlines()
                      if line.strip()
                  ]

          result = unittest.TextTestRunner(
              verbosity=2, stream=sys.stdout, resultclass=Ledgered
          ).run(suite)
          if result.skipped:
              raise SystemExit(
                  "a container runtime IS available on this runner, so a skipped "
                  "boundary case is the hole this step exists to close and never an "
                  "honest skip: "
                  + "; ".join(f"{case.id()} ({why})" for case, why in result.skipped)
              )
          if result.expectedFailures or result.unexpectedSuccesses:
              known = [f"{case.id()} (expected failure)" for case, _ in result.expectedFailures]
              known += [f"{case.id()} (unexpected success)" for case in result.unexpectedSuccesses]
              raise SystemExit(
                  "a boundary case marked @unittest.expectedFailure is a boundary "
                  "this repository knows it cannot prove, and unittest counts it "
                  "neither a failure nor a skip: " + "; ".join(sorted(known))
              )
          if not result.wasSuccessful():
              raise SystemExit(
                  f"the boundary is not proven on this runner: {len(result.failures)} "
                  f"of {result.testsRun} cases failed and {len(result.errors)} errored, "
                  "reported in full above"
              )
          if result.testsRun != loaded:
              raise SystemExit(
                  f"the loader found {loaded} boundary cases and {result.testsRun} "
                  "ran, so the run stopped short of the class it was given"
              )

          hollow = sorted(
              f"{case} (the daemon started "
              f"{sorted(images, key=str) if images else 'nothing'})"
              for case, images in result.entered.items()
              if boundary.IMAGE not in images
          )
          if hollow:
              raise SystemExit(
                  "these boundary cases passed without the daemon starting one "
                  f"container from {boundary.IMAGE} while they ran, so they named "
                  "a runtime rather than entering one and every other check here "
                  "agreed with them: " + "; ".join(hollow)
              )
          print(
              f"{result.testsRun} boundary cases ran against {boundary.IMAGE}, "
              f"none skipped, "
              f"{sum(len(images) for images in result.entered.values())} "
              "containers started"
          )
          PY

      - name: Run package tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

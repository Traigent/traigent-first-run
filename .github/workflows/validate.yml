name: Validate

on:
  pull_request:
  push:

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    # Measured, and re-derivable. Source: every successful `offline-contract`
    # job on `first-run-guide` from 2026-07-20 to 2026-08-06, n=65, read with
    # `gh run list --branch first-run-guide --workflow validate.yml` and
    # `gh run view <id> --json jobs`. Durations: 13s min / 19s p50 / 31s p95 /
    # 32s max.
    #
    # The median is the wrong number to bound against here, because the series
    # trends upward as the package grows: the ten most recent runs are 27-32s
    # against a whole-window p50 of 19s.
    #
    # But the measurement is not what sets this number, and this job is the
    # reason. `harness.py --all` calls `calibrate_evaluator.py` with no
    # `--timeout`, so that command runs on the DERIVED bound - the calibrator's
    # own ceiling plus headroom, 660s today. A five-minute job cap is 360s below
    # that, so a hung calibration was killed by GitHub with a bare cancellation
    # and the harness never wrote the partial stdout and stderr that says why.
    # The floor is therefore derived from the same constant, not chosen against
    # the measurement, and
    # `tests/test_skill_package.py::test_every_ci_job_outlives_the_harness_bound`
    # fails if this number drops below it. It is 19 minutes today: 16 for the
    # command, 3 for everything else in the job - a little over twice the
    # slowest whole job of either kind ever recorded, 104s.
    #
    # 14 until #151, which let a slow evaluator finish and so raised the
    # calibrator's ceiling to 900s - moving the floor this number is derived
    # from to 19. #162 wrote the derivation and #151 moved its input; neither
    # branch could see the other, the merge is textually clean, and the guard
    # firing on the composition is the whole reason it exists.
    timeout-minutes: 19
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Acquire pinned Python runner outside the evidence boundary
        run: >-
          docker pull
          python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de

      - name: Run hermetic pre-network contract scenarios
        run: |
          mkdir -p "$RUNNER_TEMP/traigent-offline-evidence"
          chmod 0777 "$RUNNER_TEMP/traigent-offline-evidence"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --user 65534:65534 \
            -e TRAIGENT_OFFLINE_ISOLATED=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/traigent-offline-evidence:/evidence" \
            --tmpfs /work:rw,exec,nosuid,nodev,uid=65534,gid=65534,mode=0700 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,uid=65534,gid=65534,mode=0700 \
            -w /repo \
            python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de \
            python tests/behavioral/harness.py --all --evidence-dir /evidence

      - name: Upload offline contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-contract-evidence
          path: ${{ runner.temp }}/traigent-offline-evidence
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: offline-contract
    runs-on: ubuntu-latest
    # Same source and window, n=68 (this job predates `offline-contract`, hence
    # the three extra runs): 12s min / 22.5s p50 / 97s p95 / 104s max, with the
    # same upward trend - the ten most recent are 59-104s. Added to the observed
    # maximum, not to the median: the slow-evaluator end-to-end test this branch
    # introduces sleeps 33s inside a local scorer - 33s by construction, and
    # 34.2s wall for the test measured on a developer machine, not on a runner.
    # Source: tests/behavioral/test_contracts.py#ExplicitTimeoutEndToEndTests -
    # so the projected worst case for the job's own work is about 140s.
    #
    # This job runs `tests/behavioral/test_contracts.py`, which drives the same
    # `run_command`, so the same floor applies for the same reason: at ten
    # minutes the job was killed 60s before the harness's own 660s bound could
    # fire, and the preserved-output diagnostic was exactly what was lost. Both
    # jobs now carry one derived floor rather than two hand-picked multiples of
    # two different measurements - the earlier 5x/10x split was justified by the
    # jobs' own runtimes, which is not the quantity that decides who kills the
    # command first.
    #
    # The three-minute margin still covers what was reasoned about before: this
    # job makes three `pip install` calls against live PyPI, the only step in
    # either job whose duration depends on a third party, and a slow index must
    # not be reported as a broken pull request.
    #
    # Also raised from 14 to 19 by #151's calibrator ceiling; see the note on
    # the job above.
    timeout-minutes: 19
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail fast on a lock that was never regenerated
        # `test_contracts.py` already fails on a stale lock, but only after the
        # installs, and only on parsed JSON. This runs first and compares the
        # rendered text, so a reflowed or hand-edited lock is caught too.
        # Neither check makes the lock behavioural - it stores hashes (#147).
        run: python tools/relock.py --check

      - name: Install validation tools
        run: python -m pip install ruff==0.15.12 black==26.5.1

      - name: Install pinned first-run dependencies outside the evidence boundary
        run: python -m pip install -r skills/traigent-first-run/assets/requirements-first-run.txt

      - name: Run package tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

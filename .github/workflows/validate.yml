name: Validate

on:
  pull_request:
  # `push` is limited to the trunk. Without the filter every push to a pull
  # request branch started two runs of this workflow on the same commit, a
  # `push` and a `pull_request`, within seconds of each other. Source: `gh run
  # list --workflow validate.yml` on 2026-09-14, where each branch shows the
  # pair, and run 20:50:34Z on `first-run-guide` took 14m56s end to end. The
  # merged result on `first-run-guide` is the one commit no `pull_request`
  # event tests, so that push is kept.
  push:
    branches: [first-run-guide]

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    # Measured, and re-derivable. Source: every successful `offline-contract`
    # job in the 100 most recent runs of this workflow, 2026-09-11 to
    # 2026-09-17, n=99, read with `gh run list --workflow validate.yml
    # --limit 100` and `gh api repos/Traigent/traigent-first-run/actions/runs/
    # <id>/jobs`. Durations: 35s min / 48s p50 / 52s p95 / 79s max.
    #
    # The median is the wrong number to bound against here, because the series
    # moves up as the package grows: the same job read the same way over
    # 2026-07-20 to 2026-08-06, n=65, was 13s min / 19s p50 / 32s max.
    #
    # But the measurement is not what sets this number, and this job is the
    # reason. `harness.py --all` calls `calibrate_evaluator.py` with no
    # `--timeout`, so that command runs on the DERIVED bound - the calibrator's
    # own ceiling plus headroom, 960s today. A five-minute job cap sat below
    # the bound of the day, so a hung calibration was killed by GitHub with a
    # bare cancellation and the harness never wrote the partial stdout and
    # stderr that says why. The floor is therefore derived from the same
    # constant, not chosen against the measurement, and
    # `tests/test_skill_package.py::test_every_ci_job_outlives_the_harness_bound`
    # fails if this number drops below it. It is 19 minutes today: 16 for the
    # command, 3 for everything else in this job. The slowest job in the
    # window, 79s, plus the two 20s pauses the image pull may take between
    # attempts, is 119s, inside that margin.
    #
    # 14 until #151, which let a slow evaluator finish and so raised the
    # calibrator's ceiling to 900s - moving the floor this number is derived
    # from to 19. #162 wrote the derivation and #151 moved its input; neither
    # branch could see the other, the merge is textually clean, and the guard
    # firing on the composition is the whole reason it exists.
    timeout-minutes: 19
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire pinned Python runner outside the evidence boundary
        # Docker Hub is this job's one third-party network dependency, reached
        # before any evidence exists. Run 35227118945 on `first-run-guide` lost
        # the pull to a reset TCP connection during the registry's token
        # exchange and nothing else; re-running the job on the same commit
        # pulled it. Three attempts absorb that shape of failure, and the
        # digest pin means a retry can only fetch the bytes the first attempt
        # asked for. The two pauses between attempts fit inside the margin the
        # job's timeout keeps beyond the harness bound.
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sleep 20
            fi
            if docker pull python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de; then
              exit 0
            fi
            echo "::warning::docker pull attempt $attempt of 3 failed"
          done
          echo "docker pull failed on every attempt" >&2
          exit 1

      - name: Run hermetic pre-network contract scenarios
        id: harness
        run: |
          mkdir -p "$RUNNER_TEMP/traigent-offline-evidence"
          chmod 0777 "$RUNNER_TEMP/traigent-offline-evidence"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --user 65534:65534 \
            -e TRAIGENT_OFFLINE_ISOLATED=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/traigent-offline-evidence:/evidence" \
            --tmpfs /work:rw,exec,nosuid,nodev,uid=65534,gid=65534,mode=0700 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,uid=65534,gid=65534,mode=0700 \
            -w /repo \
            python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de \
            python tests/behavioral/harness.py --all --evidence-dir /evidence

      - name: Upload offline contract evidence
        # `always()` on its own made one failed pull report as two failures:
        # the harness never ran, nothing created the evidence directory, and
        # `if-no-files-found: error` then failed this step for a directory no
        # step had promised. Evidence is owed once the harness has started,
        # so the upload runs whenever that step reached any outcome - pass,
        # fail, or the job's own timeout - and is skipped with it otherwise.
        # `error` stays: a harness that ran and wrote nothing is exactly the
        # defect this artifact exists to surface.
        if: always() && steps.harness.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: offline-contract-evidence
          path: ${{ runner.temp }}/traigent-offline-evidence
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: offline-contract
    runs-on: ubuntu-latest
    # Same source and window, n=99: 438s min / 638s p50 / 806s p95 / 842s max,
    # the ten most recent 588-834s. Over 2026-07-20 to 2026-08-06 the same job
    # was 12s min / 104s max; the unit suite has grown since, and its
    # slow-evaluator end-to-end test alone holds a local scorer for 33s by
    # construction. Source:
    # tests/behavioral/test_contracts.py#ExplicitTimeoutEndToEndTests.
    #
    # This job runs `tests/behavioral/test_contracts.py`, which drives the same
    # `run_command`, so the same floor applies for the same reason: at ten
    # minutes the job was killed 60s before the harness's own bound of the day
    # could fire, and the preserved-output diagnostic was exactly what was
    # lost. The floor is not enough on its own here, though. It assumes the
    # bounded command starts inside the three-minute margin, and in this job
    # it starts wherever the suite has reached, up to the whole 842s. So this
    # cap is the floor plus the job's own measured work, rounded up to whole
    # minutes: 19 + 15 = 34. `harness.py` derives the floor and the workflow
    # adds the job's own runtime, and the test named above holds the relation.
    #
    # The three-minute margin still covers what was reasoned about before: this
    # job makes three `pip install` calls against live PyPI, the steps in this
    # job whose duration depends on a third party (the job above has its image
    # pull), and a slow index must not be reported as a broken pull request.
    #
    # Raised from 14 to 19 by #151's calibrator ceiling; see the note on the
    # job above. Raised to 34 when the suite's own runtime was re-measured.
    timeout-minutes: 34
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Fail fast on a lock that was never regenerated
        # The scenario fixture locks are the only generated locks left.
        # `test_contracts.py` already fails on a stale one, but only after the
        # installs, and only on parsed JSON. This runs first and compares the
        # rendered text, so a reflowed or hand-edited lock is caught too.
        run: python tools/relock.py --check

      - name: Install validation tools
        run: python -m pip install ruff==0.15.12 black==26.5.1

      - name: Install pinned first-run dependencies outside the evidence boundary
        run: python -m pip install -r skills/traigent-first-run/assets/requirements-first-run.txt

      - name: Run package tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .
